<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Forgot password</title>
  <link rel="stylesheet" href="data:text/css,body{font-family:system-ui;max-width:360px;margin:60px auto}input,button{display:block;width:100%;margin:8px 0;padding:8px}" />
</head>
<body>
  <h1>Reset your password</h1>
  <form id="form">
    <label>Email <input id="email" type="email" required /></label>
    <button id="submit" type="submit">Send reset link</button>
  </form>
  <p id="message" role="status"></p>
  <script>
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch("/api/password-reset/request", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: document.getElementById("email").value }),
      });
      const data = await res.json();
      // FLAW: shows the server's raw error, leaking whether the account exists.
      document.getElementById("message").textContent = data.message || data.detail;
    });
  </script>
</body>
</html>
