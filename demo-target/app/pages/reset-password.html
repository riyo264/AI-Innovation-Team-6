<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Choose a new password</title>
  <link rel="stylesheet" href="data:text/css,body{font-family:system-ui;max-width:360px;margin:60px auto}input,button{display:block;width:100%;margin:8px 0;padding:8px}" />
</head>
<body>
  <h1>Choose a new password</h1>
  <form id="form">
    <label>Reset token <input id="token" required /></label>
    <label>New password <input id="new_password" type="password" required /></label>
    <button id="submit" type="submit">Update password</button>
  </form>
  <p id="message" role="status"></p>
  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("token")) document.getElementById("token").value = params.get("token");
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const res = await fetch("/api/password-reset/confirm", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          token: document.getElementById("token").value,
          new_password: document.getElementById("new_password").value,
        }),
      });
      const data = await res.json();
      document.getElementById("message").textContent = data.message || data.detail;
    });
  </script>
</body>
</html>
